        _parser.add_argument("--runtime-job-id", dest="runtime_job_id", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--runtime-code-location", dest="runtime_code_location", type=json.loads, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--tkn-tokenizer", dest="tkn_tokenizer", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--tkn-tokenizer-args", dest="tkn_tokenizer_args", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--tkn-doc-id-column", dest="tkn_doc_id_column", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--tkn-doc-content-column", dest="tkn_doc_content_column", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--tkn-text-lang", dest="tkn_text_lang", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--tkn-chunk-size", dest="tkn_chunk_size", type=int, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("----output-paths", dest="_output_paths", type=str, nargs=1)
        _parsed_args = vars(_parser.parse_args())
        _output_files = _parsed_args.pop("_output_paths", [])

        _outputs = compute_exec_params_func(**_parsed_args)

        _outputs = [_outputs]

        _output_serializers = [
            _serialize_json,

        ]

        import os
        for idx, output_file in enumerate(_output_files):
            try:
                os.makedirs(os.path.dirname(output_file))
            except OSError:
                pass
            with open(output_file, 'w') as f:
                f.write(_output_serializers[idx](_outputs[idx]))
