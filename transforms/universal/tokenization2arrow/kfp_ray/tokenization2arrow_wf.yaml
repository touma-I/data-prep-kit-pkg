            from distutils.util import strtobool
            return strtobool(s) == 1

        def _serialize_json(obj) -> str:
            if isinstance(obj, str):
                return obj
            import json

            def default_serializer(obj):
                if hasattr(obj, 'to_struct'):
                    return obj.to_struct()
                else:
                    raise TypeError(
                        "Object of type '%s' is not JSON serializable and does not have .to_struct() method."
                        % obj.__class__.__name__)

            return json.dumps(obj, default=default_serializer, sort_keys=True)

        import json
        import argparse
        _parser = argparse.ArgumentParser(prog='Compute exec params func', description='')
        _parser.add_argument("--worker-options", dest="worker_options", type=json.loads, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--actor-options", dest="actor_options", type=json.loads, required=True, default=argparse.SUPPRESS)
